<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#243E6B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="YB메일" />
  <meta name="referrer" content="no-referrer" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <title>YB-Mail</title>
  <!-- 설치 안내 이벤트는 앱 코드보다 먼저 올 수 있어 가장 먼저 받아 둠 -->
  <script>window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__bip=e;window.dispatchEvent(new Event('ybm-bip'));});</script>
</head>
<body class="booting">
  <div id="app" class="app" data-view="list">
    <!-- 1열: 계정·편지함 -->
    <nav class="pane pane-side" id="side" aria-label="편지함">
      <header class="pane-head">
        <span class="brand"><img class="brand-icon" src="icons/icon.svg" alt="" width="26" height="26" />YB-Mail</span>
        <span class="grow"></span>
        <button class="btn-install" id="btn-install" hidden title="YB-Mail을 PC 프로그램(앱)으로 설치 — 바탕화면·작업표시줄·시작 메뉴">설치하기</button>
        <button class="icon-btn only-drawer" id="btn-side-close" aria-label="닫기">✕</button>
      </header>
      <div class="side-compose"><button class="btn-primary btn-compose" id="btn-compose" title="새 메일 (C)">✎ 새 메일</button><button class="btn-ghost btn-pop" id="btn-compose-pop" title="새 창에서 쓰기 (메일을 보면서 작성)"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="4.5" y="1.5" width="10" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11.5 12v1a1.5 1.5 0 0 1-1.5 1.5H3A1.5 1.5 0 0 1 1.5 13V6A1.5 1.5 0 0 1 3 4.5h1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
      <div class="folders" id="folders"></div>
      <footer class="pane-foot">
        <button class="btn-ghost btn-sm" id="btn-add-acc">＋ 계정 추가</button>
        <span class="grow"></span>
        <button class="icon-btn" id="btn-menu" title="설정" aria-label="설정">⚙</button>
      </footer>
      <div class="gutter" id="gut-side" title="끌어서 너비 조절 (두 번 누르면 원래대로)"></div>
    </nav>
    <div class="scrim only-drawer" id="scrim"></div>

    <!-- 2열: 메일 목록 -->
    <section class="pane pane-list" aria-label="메일 목록">
      <header class="pane-head">
        <button class="icon-btn only-drawer" id="btn-side" aria-label="편지함 열기">☰</button>
        <h1 id="list-title">받은편지함</h1>
        <button class="btn-install only-drawer-inst" id="btn-install2" hidden title="YB-Mail을 PC 프로그램(앱)으로 설치">설치하기</button>
        <button class="icon-btn" id="btn-refresh" title="새로 고침 (F5 대신)" aria-label="새로 고침">⟳</button>
      </header>
      <div class="filters">
        <input id="search" class="search" type="search" placeholder="메일 검색 (Gmail 검색어 가능)" enterkeyhint="search" />
        <button class="chip" id="chip-unread" title="읽지 않은 메일만">안읽음</button>
      </div>
      <div id="banner" class="banner" hidden></div>
      <div id="notif-ask" class="notif-ask" hidden><span>🔔 받은편지함에 새 메일이 오면 화면 오른쪽 아래에 알려 드릴까요?</span><button class="btn-primary btn-sm" id="notif-yes">알림 켜기</button><button class="btn-ghost btn-sm" id="notif-no">나중에</button></div>
      <ul id="list" class="list"></ul>
      <footer class="pane-foot">
        <span id="sync" class="sync" data-s="pending">● 준비 중…</span>
        <span id="version" class="version"></span>
      </footer>
      <div class="gutter" id="gut-list" title="끌어서 너비 조절 (두 번 누르면 원래대로)"></div>
    </section>

    <!-- 3열: 읽기 -->
    <main class="pane pane-read" aria-label="메일 읽기">
      <header class="pane-head read-head">
        <button class="btn-back only-narrow" data-go="list" aria-label="목록으로">‹ 목록</button>
        <span class="grow"></span>
        <button class="txt-btn" data-act="reply" title="답장 (R)" disabled>답장</button>
        <button class="txt-btn" data-act="replyAll" title="전체 답장 (A)" disabled>전체 답장</button>
        <button class="txt-btn" data-act="forward" title="전달 (F)" disabled>전달</button>
        <span class="sep"></span>
        <button class="icon-btn" data-act="archive" title="보관 (E) — 받은편지함에서 빼기" disabled>🗄</button>
        <button class="icon-btn" data-act="trash" title="삭제 (Del) — 휴지통으로" disabled>🗑</button>
        <button class="icon-btn" data-act="unread" title="읽지 않음으로 (U)" disabled>✉</button>
        <button class="icon-btn" data-act="star" title="별표 (S)" disabled>☆</button>
      </header>
      <div class="read-wrap" id="read-wrap">
        <div id="reader" class="reader" hidden></div>
        <div id="empty-read" class="placeholder">
          <img src="icons/icon.svg" alt="" width="64" height="64" />
          <p class="ph-title">메일을 선택하세요</p>
          <p>두 계정의 메일이 한 목록에 모입니다.<br />왼쪽 색 띠로 어느 계정 메일인지 구분합니다.</p>
        </div>
      </div>
      <div class="gutter gut-cp" id="gut-cp" title="끌어서 너비 조절 (두 번 누르면 반반)"></div>
      <!-- 메일 쓰기 (기본: 읽기 영역 전체) -->
      <div id="compose" class="compose" hidden>
        <div class="cp-card" role="dialog" aria-label="메일 쓰기">
          <header class="cp-head">
            <b id="cp-title">새 메일</b>
            <span class="grow"></span>
            <button class="txt-btn" id="cp-side" title="왼쪽에 메일, 오른쪽에 쓰기" hidden>메일과 나란히</button>
            <button class="icon-btn" id="cp-pop" title="새 창으로 떼어 내기 (메일을 보면서 작성)" aria-label="새 창"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="4.5" y="1.5" width="10" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11.5 12v1a1.5 1.5 0 0 1-1.5 1.5H3A1.5 1.5 0 0 1 1.5 13V6A1.5 1.5 0 0 1 3 4.5h1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
            <button class="txt-btn" id="cp-float" title="작은 창으로 띄우기">작은 창</button>
            <button class="icon-btn" id="cp-min" title="최소화" aria-label="최소화" hidden>▁</button>
            <button class="icon-btn" id="cp-close" title="닫기" aria-label="닫기">✕</button>
          </header>
          <div class="cp-body">
            <label class="cp-row"><span>보내는 계정</span><select id="cp-from" class="sel"></select></label>
            <label class="cp-row"><span>받는 사람</span><input id="cp-to" type="text" autocomplete="off" placeholder="이름 <주소>, 여러 명은 쉼표" /><button type="button" class="cp-ccbtn" id="cp-ccbtn">참조·숨은참조</button></label>
            <label class="cp-row" data-cc hidden><span>참조</span><input id="cp-cc" type="text" autocomplete="off" /></label>
            <label class="cp-row" data-cc hidden><span>숨은참조</span><input id="cp-bcc" type="text" autocomplete="off" /></label>
            <label class="cp-row"><span>제목</span><input id="cp-subject" type="text" /></label>
            <div id="cp-atts" class="atts cp-atts" hidden></div>
            <div id="cp-editor" class="cp-editor" contenteditable="true" spellcheck="false" aria-label="내용"></div>
            <details id="cp-quote" class="cp-quote" hidden><summary>원문 포함됨 (눌러서 보기)</summary><div id="cp-quote-view"></div></details>
            <div id="cp-sigwrap" class="cp-sigwrap"><span class="cp-sig-l">서명</span><div id="cp-sig" class="cp-sig" contenteditable="true" spellcheck="false" aria-label="서명"></div></div>
          </div>
          <footer class="cp-foot">
            <button class="btn-primary" id="cp-send" title="보내기 (Ctrl+Enter)">보내기</button>
            <button class="btn-ghost" id="cp-draft" title="임시메일함에 저장">임시 저장</button>
            <button class="btn-ghost" id="cp-attach">📎 파일 첨부</button>
            <span class="tools-sep"></span>
            <div id="cp-tools" class="cp-tools"></div>
            <span id="cp-msg" class="cp-msg"></span>
          </footer>
        </div>
      </div>
    </main>
  </div>

  <button class="fab" id="fab" aria-label="새 메일">✎</button>

  <!-- 처음 설정·계정 연결 -->
  <div id="gate" class="gate" hidden>
    <div class="login-card" id="gate-card"></div>
  </div>

  <input id="file-attach" type="file" multiple hidden />
  <div id="pop" class="pop" hidden></div>
  <ul id="suggest" class="suggest" hidden></ul>
  <div id="sendbar" class="sendbar" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="drop" class="drop" hidden><p>여기에 놓으면 첨부됩니다</p></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
