<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B4A80"/>
      <stop offset="1" stop-color="#16294F"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6ECF6"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9CC0FF"/>
      <stop offset="1" stop-color="#6E97DE"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3F86F0"/>
      <stop offset="1" stop-color="#1E55B8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A1630" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 열린 봉투: 뒷면 + 위로 열린 덮개 -->
  <path d="M128 236 L300 120 L472 236 V420 H128 Z" fill="#4E73B4"/>
  <!-- 꺼내지는 편지지 -->
  <g filter="url(#sh)">
    <rect x="172" y="150" width="256" height="210" rx="14" fill="url(#paper)"/>
  </g>
  <rect x="204" y="186" width="150" height="16" rx="8" fill="#7FA6E8"/>
  <rect x="204" y="220" width="192" height="12" rx="6" fill="#C9D5E8"/>
  <rect x="204" y="246" width="170" height="12" rx="6" fill="#C9D5E8"/>
  <!-- 봉투 앞면(아래 V자 주머니) -->
  <path d="M128 236 L300 352 L472 236 V404 Q472 424 452 424 H148 Q128 424 128 404 Z" fill="url(#front)"/>
  <path d="M338 316 L460 404" fill="none" stroke="#5C86CF" stroke-width="8" stroke-linecap="round"/>
  <!-- 왼쪽 아래 M 타일 -->
  <g filter="url(#sh)">
    <rect x="40" y="228" width="200" height="200" rx="34" fill="url(#tile)" stroke="#16294F" stroke-width="8"/>
  </g>
  <path d="M86 382 V274 L140 340 L194 274 V382" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
